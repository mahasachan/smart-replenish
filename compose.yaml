services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smartreplenish
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smartreplenish"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
